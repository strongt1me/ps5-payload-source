name: Update payload source

on:
  # Check for new releases regularly (every hour, minute 17)
  schedule:
    - cron: "17 * * * *"
  # Start manually: Actions -> "Update payload source" -> Run workflow
  workflow_dispatch:
  # Start immediately when another repository reports a release (optional, see README)
  repository_dispatch:
    types: [payload-released]
  # Rebuild when the script itself changes
  push:
    branches: [main]
    paths:
      - build_source.py
      - .github/workflows/update-source.yml

permissions:
  contents: write

concurrency:
  group: update-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rebuild payloads.json
        run: python build_source.py

      - name: Commit changes
        run: |
          if git diff --quiet -- payloads.json && git ls-files --error-unmatch payloads.json >/dev/null 2>&1; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add payloads.json
          git commit -m "Update payloads.json"
          git push
